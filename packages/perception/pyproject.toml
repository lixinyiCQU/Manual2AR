[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "manual2ar-perception"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["manual2ar-contracts", "numpy", "opencv-python-headless", "pillow"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"*" = ["VERSION", "defaults/*.json", "templates/*.html", "*.json"]
