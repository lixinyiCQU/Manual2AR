[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manual2ar-baseline"
version = "0.7.2"
description = "Independent, evidence-driven task baseline"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "pillow>=11,<13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
