services:
  manual2ar-sam2:
    build:
      context: ..
      dockerfile: gpu_tracking_service/Dockerfile
    ports:
      - "8020:8020"
    environment:
      MANUAL2AR_SAM2_MODEL: facebook/sam2.1-hiera-tiny
      MANUAL2AR_GROUNDING_MODEL: IDEA-Research/grounding-dino-tiny
      HF_HOME: /models/huggingface
    volumes:
      - manual2ar-hf-cache:/models/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  manual2ar-hf-cache:
